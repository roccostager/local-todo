<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local-todo</title>
    
    <link rel="icon" type="image/x-icon" href="icons/local-todo.ico">
</head>

<body class="dark">
    <div class="header">
        <div class="left-anchor">
            <img src="icons/local-todo.ico" alt="local-todo icon">
            <div class="logo">
                <p class="h1">local</p>
                <p class="h2">to-do</p>
            </div>
        </div>
        <button id="dark-mode-toggle" class="button p"></button>
    </div>

    <div class="sidebar">
        <div class="static-title">
            <p class="h2">My Notes</p>
            <div class="popup-button">
                <button id="popup-button" class="button p">+Note</button>
                <div id="popup-content" class="modal">
                    <p class="modal-title h3">Create New Note</p>
                    <div class="modal-content">
                        <form id="note-create-form">
                            <div class="form-section">
                                <label for="note-name" class="p">name:</label>
                                <input autocomplete="off" id="note-name" name="name" type="text" class="p" required>
                            </div>

                            <div class="form-section">
                                <label for="note-desc" class="p">description:</label>
                                <input autocomplete="off" id="note-desc" name="description" type="text" class="p" required>
                            </div>
                            
                            <div class="submission-section">
                                <button type="submit" class="button p">+Create Note</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="directories-container">
        </div>
    </div>

    <div class="content p"></div>
</body>

</html>
